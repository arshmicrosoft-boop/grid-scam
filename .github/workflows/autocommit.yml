name: Auto commit

on:
  schedule:
    - cron: "30 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  auto_commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create random number of commits
        run: |
          git config --local user.email "arshmicrosoft@gmail.com"
          git config --local user.name "arshmicrosoft-boop"

          COMMIT_COUNT=$((RANDOM % 10 + 1))

          if [ $COMMIT_COUNT -le 6 ]; then
            COMMIT_COUNT=1
          elif [ $COMMIT_COUNT -le 8 ]; then
            COMMIT_COUNT=2
          elif [ $COMMIT_COUNT -le 9 ]; then
            COMMIT_COUNT=3
          else
            COMMIT_COUNT=$((RANDOM % 5 + 4))
          fi

          echo "Creating $COMMIT_COUNT commits today"

          for i in $(seq 1 $COMMIT_COUNT); do
            echo "Automated repository maintenance - $(date -u '+%Y-%m-%dT%H:%M:%SZ')" >> activity.log
            git add activity.log
            git commit -m "chore: automated repository maintenance"
          done

      - name: Push changes
        uses: ad-m/github-push-action@master
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
